# XcodeGen spec — generates TidyDesk.xcodeproj
#   brew install xcodegen
#   xcodegen generate
#   open TidyDesk.xcodeproj
name: TidyDesk
options:
  bundleIdPrefix: com.powervh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

fileGroups:
  - README.md
  - PROJECT_NOTES.md
  - MAC_BUILD.md
  - ASSETS.md
  - tools
  - schema

targets:
  TidyDesk:
    type: application
    platform: iOS
    sources:
      - path: TidyDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powervh.tidydesk
        PRODUCT_NAME: TidyDesk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tidy Desk
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # Set your team to run on a real iPhone (haptics only work on device):
        DEVELOPMENT_TEAM: ""

  TidyDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TidyDeskTests
    dependencies:
      - target: TidyDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.powervh.tidydesk.tests

schemes:
  TidyDesk:
    build:
      targets:
        TidyDesk: all
        TidyDeskTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TidyDeskTests
    archive:
      config: Release
